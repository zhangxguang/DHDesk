name: Build desktop artifacts

on:
  pull_request:
  push:
    branches:
      - main
      - feature/windows-support
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DHDESK_RELEASE_SIGNING: ${{ matrix.platform == 'darwin' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      DHDESK_DEVELOPER_ID_SHA1: 21F5693C7C25FA8759E14E1C2751628E0BD38428
      DHDESK_DEVELOPER_ID_NAME: "Developer ID Application: xiangguang zhang (2NW8BV74J4)"
      DHDESK_APPLE_TEAM_ID: 2NW8BV74J4
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 DMG
            runner: macos-14
            platform: darwin
            arch: arm64
            package-script: package:dmg:ci
            artifact-name: DHDesk-mac-arm64
            artifact-path: |
              release/*.dmg
              release/*.dmg.sha256
          - name: Windows x64 NSIS
            runner: windows-2022
            platform: win32
            arch: x64
            package-script: package:nsis
            artifact-name: DHDesk-win-x64
            artifact-path: |
              release/*.exe
              release/*.exe.sha256

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify native runner
        env:
          DHDESK_EXPECTED_PLATFORM: ${{ matrix.platform }}
          DHDESK_EXPECTED_ARCH: ${{ matrix.arch }}
        run: node scripts/assert-build-target.mjs

      - name: Install project dependencies
        run: npm ci

      - name: Restore platform Runtime cache
        uses: actions/cache@v4
        with:
          path: |
            resources/node
            resources/bundled-runtime
          key: dhdesk-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/runtime-manifest.json') }}

      - name: Prepare native Runtime
        run: npm run runtime:prepare

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure macOS release signing
        if: matrix.platform == 'darwin' && env.DHDESK_RELEASE_SIGNING == 'true'
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          required_secrets=(
            MAC_CERTIFICATE_P12
            MAC_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done
          if [[ "${APPLE_TEAM_ID}" != "${DHDESK_APPLE_TEAM_ID}" ]]; then
            echo "APPLE_TEAM_ID does not match the DHDesk Developer ID certificate." >&2
            exit 1
          fi

          signing_dir="${RUNNER_TEMP}/dhdesk-signing"
          keychain_path="${RUNNER_TEMP}/dhdesk-signing.keychain-db"
          certificate_path="${signing_dir}/developer-id.p12"
          api_key_path="${signing_dir}/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -base64 32)"

          {
            echo "DHDESK_SIGNING_DIR=${signing_dir}"
            echo "DHDESK_KEYCHAIN_PATH=${keychain_path}"
            echo "DHDESK_API_KEY_PATH=${api_key_path}"
          } >> "${GITHUB_ENV}"

          mkdir -p "${signing_dir}"
          chmod 700 "${signing_dir}"
          printf '%s' "${MAC_CERTIFICATE_P12}" | openssl base64 -d -A > "${certificate_path}"
          printf '%s' "${APPLE_API_KEY_P8}" | openssl base64 -d -A > "${api_key_path}"
          chmod 600 "${certificate_path}" "${api_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MAC_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s \
            "${keychain_path}" \
            "${HOME}/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "${keychain_path}"
          identity_output="$(security find-identity -v -p codesigning "${keychain_path}")"
          printf '%s\n' "${identity_output}"
          expected_identity="${DHDESK_DEVELOPER_ID_SHA1} \"${DHDESK_DEVELOPER_ID_NAME}\""
          if ! grep -Fq "${expected_identity}" <<< "${identity_output}"; then
            echo "The imported certificate is not the expected DHDesk Developer ID identity." >&2
            exit 1
          fi
          if ! grep -Fq "1 valid identities found" <<< "${identity_output}"; then
            echo "Unable to validate the imported Developer ID identity." >&2
            exit 1
          fi

      - name: Package unsigned macOS artifact
        if: matrix.platform == 'darwin' && env.DHDESK_RELEASE_SIGNING != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:dmg:ci

      - name: Package signed and notarized macOS artifact
        if: matrix.platform == 'darwin' && env.DHDESK_RELEASE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export CSC_KEYCHAIN="${DHDESK_KEYCHAIN_PATH}"
          # electron-builder expects the identity name without its certificate-type prefix.
          # The exact SHA-1 and full subject were already validated in the temporary keychain.
          export CSC_NAME="${DHDESK_DEVELOPER_ID_NAME#Developer ID Application: }"
          export APPLE_API_KEY="${DHDESK_API_KEY_PATH}"
          npm run package:dmg

          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "${dmg_path}" ]]; then
            echo "Signed macOS DMG was not generated." >&2
            exit 1
          fi

          codesign \
            --force \
            --sign "${DHDESK_DEVELOPER_ID_SHA1}" \
            --timestamp \
            --keychain "${DHDESK_KEYCHAIN_PATH}" \
            "${dmg_path}"
          codesign --verify --strict --verbose=2 "${dmg_path}"
          xcrun notarytool submit "${dmg_path}" \
            --key "${APPLE_API_KEY}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

      - name: Package Windows artifact
        if: matrix.platform == 'win32'
        run: npm run package:nsis

      - name: Verify macOS application signature
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          app_path="release/mac-arm64/DHDesk.app"
          if [[ ! -d "$app_path" ]]; then
            echo "macOS app bundle was not generated: $app_path" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"

          if [[ "${DHDESK_RELEASE_SIGNING}" == "true" ]]; then
            dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            codesign --verify --strict --verbose=2 "${dmg_path}"
            codesign -dv --verbose=4 "$app_path" 2>&1 | grep -F "Authority=Developer ID Application:"
            xcrun stapler validate "$app_path"
            xcrun stapler validate "${dmg_path}"
            spctl -a -t exec -v "$app_path"
            spctl -a -t open --context context:primary-signature -v "${dmg_path}"
          fi

      - name: Verify Windows installer extraction
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path release -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows NSIS installer was not generated."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "DHDesk-install-smoke"
          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") `
            -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Windows NSIS installer did not finish within 180 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "Windows NSIS installer failed with exit code $($process.ExitCode)."
          }

          $appExecutable = Join-Path $installDir "DHDesk.exe"
          $nodeExecutable = Join-Path $installDir "resources\node\node.exe"
          $dshEntry = Join-Path $installDir "resources\bundled-runtime\node_modules\@deepseek-ai\dsh\lib\bin.js"
          foreach ($requiredPath in @($appExecutable, $nodeExecutable, $dshEntry)) {
            if (-not (Test-Path $requiredPath -PathType Leaf)) {
              throw "Installed package is missing: $requiredPath"
            }
          }

          $expectedVersion = (Get-Content resources/runtime-manifest.json | ConvertFrom-Json).harnessVersion
          $installedVersion = (& $nodeExecutable $dshEntry --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne $expectedVersion) {
            throw "Installed Harness version '$installedVersion' does not match '$expectedVersion'."
          }

      - name: Write SHA-256 checksums
        run: npm run artifacts:checksums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Remove temporary macOS signing assets
        if: always() && matrix.platform == 'darwin' && env.DHDESK_RELEASE_SIGNING == 'true'
        shell: bash
        run: |
          if [[ -n "${DHDESK_KEYCHAIN_PATH:-}" && -f "${DHDESK_KEYCHAIN_PATH}" ]]; then
            security default-keychain -d user -s "${HOME}/Library/Keychains/login.keychain-db" || true
            security delete-keychain "${DHDESK_KEYCHAIN_PATH}" || true
          fi
          if [[ -n "${DHDESK_SIGNING_DIR:-}" && -d "${DHDESK_SIGNING_DIR}" ]]; then
            find "${DHDESK_SIGNING_DIR}" -type f -delete
            rmdir "${DHDESK_SIGNING_DIR}" || true
          fi
