extends: electron-builder.base.yml
extraResources:
  - from: resources/node
    to: node
    filter:
      - bin/node
      - bin/npm
      - bin/npx
      - LICENSE
  - from: resources/node/lib/node_modules/npm
    to: node/lib/node_modules/npm
    filter:
      - "**/*"
      - "!**/*.d.ts"
      - "!**/*.map"
      - "!**/{test,tests,__tests__,example,examples}/**/*"
      - "!**/{README,README.*,readme,readme.*,CHANGELOG,CHANGELOG.*,changelog,changelog.*,HISTORY,HISTORY.*,history,history.*,CONTRIBUTING,CONTRIBUTING.*,contributing,contributing.*}"
  # electron-builder skips a source directory named node_modules by default.
  - from: resources/bundled-runtime/node_modules
    to: bundled-runtime/node_modules
    filter:
      - "**/*"
      - "!**/*.d.ts"
      - "!**/*.map"
      - "!**/{test,tests,__tests__,example,examples}/**/*"
      - "!**/{README,README.*,readme,readme.*,CHANGELOG,CHANGELOG.*,changelog,changelog.*,HISTORY,HISTORY.*,history,history.*,CONTRIBUTING,CONTRIBUTING.*,contributing,contributing.*}"
      - "!node-pty/prebuilds/win32-*/**/*"
      - "!node-pty/prebuilds/linux-*/**/*"
      - "!node-pty/prebuilds/darwin-x64/**/*"
mac:
  icon: resources/icons/app-icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  title: "DHDesk ${version}"
  artifactName: "DHDesk-${version}-mac-${arch}.${ext}"
