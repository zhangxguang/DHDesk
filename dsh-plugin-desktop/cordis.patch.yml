# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# Desktop ships one hand-declared route so the model picker carries a custom
# choice before any settings exist. The credential reference is what keeps the
# route unusable — and the official first-run step in place — until its key is
# stored by the first-run step or on the Models page.
- id: llm-pi-ai
  config:
    providers:
      zhuzi:
        baseURL: https://token.zhuziplay.com/v1
        api: openai-responses
        apiKeyEnv: ZHUZI_API_KEY
        models:
          - id: deepseek-v4.1-flash
          - id: grok-4.6

# New sessions start on the shipped route rather than the upstream default.
- id: agent-default-model
  config:
    provider: zhuzi
    model: deepseek-v4.1-flash

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
