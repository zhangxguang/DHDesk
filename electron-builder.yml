appId: com.zxg.dhdesk
productName: DHDesk
copyright: Copyright © 2026 zxg
asar: true
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/node
    to: node
    filter:
      - "bin/node"
      - "bin/npm"
      - "bin/npx"
      - "LICENSE"
  - from: resources/node/lib/node_modules/npm
    to: node/lib/node_modules/npm
    filter:
      - "**/*"
  - from: resources/bundled-runtime
    to: bundled-runtime
    filter:
      - "package.json"
      - "package-lock.json"
  # electron-builder deliberately skips a source directory named node_modules.
  # Mapping its contents as a separate resource keeps the Harness tree intact.
  - from: resources/bundled-runtime/node_modules
    to: bundled-runtime/node_modules
    filter:
      - "**/*"
      - "!node-pty/prebuilds/win32-*/**/*"
      - "!node-pty/prebuilds/darwin-x64/**/*"
mac:
  icon: resources/icons/app-icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  title: "DHDesk ${version}"
  artifactName: "DHDesk-${version}-${arch}.${ext}"
